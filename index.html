<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Civdle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="bar">
      <h1><a id="site-title" href="#accueil" title="Sommaire des modes de jeu">Civdle</a></h1>
      <nav id="tabs" aria-label="Modes de jeu"></nav>
      <div class="bar-actions">
      <button type="button" id="feedback-open" class="icon-btn" title="Donner un avis" aria-label="Donner un avis" aria-haspopup="dialog" hidden>
        <!-- Speech bubble drawn for this site. -->
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 5.5h16v10.5H10l-4.5 3.5V16H4z"/>
          <path d="M8 9.5h8M8 12.5h5" stroke-linecap="round"/>
        </svg>
      </button>
      <button type="button" id="settings-open" class="icon-btn" title="Paramètres" aria-label="Paramètres" aria-haspopup="dialog">
        <!-- Gear drawn for this site: dashed ring = teeth. -->
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" aria-hidden="true">
          <circle cx="12" cy="12" r="8" stroke-width="3" stroke-dasharray="3.28 3"/>
          <circle cx="12" cy="12" r="6.2" stroke-width="1.8"/>
          <circle cx="12" cy="12" r="2.4" stroke-width="1.8"/>
        </svg>
      </button>
      </div>
    </div>
  </header>
  <main id="game"><p class="notice">Chargement…</p></main>
  <dialog id="settings" aria-labelledby="settings-title">
    <h2 id="settings-title">Paramètres</h2>
    <label class="setting">
      <input type="checkbox" id="opt-colorblind">
      <span>
        <span class="setting-label">Mode daltonien</span>
        <span class="setting-hint">Bleu = identique, orange = partiel, gris = différent (au lieu de vert / orange / rouge), aussi dans le résultat copié.</span>
      </span>
    </label>
    <button type="button" class="dialog-close">Fermer</button>
  </dialog>
  <dialog id="feedback" aria-labelledby="feedback-title">
    <h2 id="feedback-title">Donner un avis</h2>
    <form id="feedback-form">
      <label class="field">
        <span class="setting-label">Message</span>
        <textarea name="message" rows="5" maxlength="2000" required placeholder="Une erreur dans un indice, une idée de mode, un bug…"></textarea>
      </label>
      <label class="field">
        <span class="setting-label">E-mail <span class="setting-hint-inline">(facultatif, pour une réponse)</span></span>
        <input type="email" name="email" autocomplete="email">
      </label>
      <!-- Honeypot: hidden from people, filled by some bots (Formspree drops those). -->
      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
      <p class="feedback-status" role="status"></p>
      <div class="dialog-actions">
        <button type="button" class="dialog-close">Fermer</button>
        <button type="submit" class="dialog-submit">Envoyer</button>
      </div>
    </form>
  </dialog>
  <footer>
    <!-- Other -dle games. Icons drawn for this site (simple stand-ins, not the
         games' logos): Poké Ball, gold "L", Konoha-style spiral leaf, straw hat. -->
    <section class="other-dle" aria-labelledby="other-dle-title">
      <p class="other-dle-kicker">Tu en veux plus ?</p>
      <h2 id="other-dle-title">Joue à d'autres jeux :</h2>
      <ul>
        <li><a href="https://pokedle.net/" target="_blank" rel="noopener">
          <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="#F4F4F4" stroke="#1A1A1A" stroke-width="2"/><path d="M3 16a13 13 0 0 1 26 0z" fill="#D63A3A" stroke="#1A1A1A" stroke-width="2"/><path d="M3 16h26" stroke="#1A1A1A" stroke-width="2.5"/><circle cx="16" cy="16" r="4" fill="#F4F4F4" stroke="#1A1A1A" stroke-width="2"/></svg>
          <span>Pokédle</span></a></li>
        <li><a href="https://loldle.net/" target="_blank" rel="noopener">
          <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#0A1A20" stroke="#C8AA6E" stroke-width="2"/><path d="M11 8h5v13h6l-2 3H11z" fill="#C8AA6E"/></svg>
          <span>LoLdle</span></a></li>
        <li><a href="https://narutodle.net/" target="_blank" rel="noopener">
          <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#2B3A4A" stroke="#E8853A" stroke-width="2"/><path d="M16 9a7 7 0 1 0 7 7c0-2.4-1.9-4.2-4.2-4.2a3 3 0 1 0 3 3" fill="none" stroke="#E8853A" stroke-width="2.4" stroke-linecap="round"/><path d="M16 9l-2-3" stroke="#E8853A" stroke-width="2.4" stroke-linecap="round"/></svg>
          <span>Narutodle</span></a></li>
        <li><a href="https://onepiecedle.net/" target="_blank" rel="noopener">
          <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#1F4E79" stroke="#E8C547" stroke-width="2"/><ellipse cx="16" cy="20" rx="11" ry="3.2" fill="#E8C547"/><path d="M9.5 19.5c0-6 2.9-9 6.5-9s6.5 3 6.5 9z" fill="#E8C547"/><path d="M9.8 17.5h12.4" stroke="#C0392B" stroke-width="2.2"/></svg>
          <span>Onepiecedle</span></a></li>
      </ul>
    </section>
    <p>Site de fans non officiel, sans lien avec Firaxis Games ni 2K.</p>
  </footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
