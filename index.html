<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Civdle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="bar">
      <h1><a id="site-title" href="#accueil" title="Sommaire des modes de jeu">Civdle</a></h1>
      <nav id="tabs" aria-label="Modes de jeu"></nav>
      <button type="button" id="settings-open" class="icon-btn" title="Paramètres" aria-label="Paramètres" aria-haspopup="dialog">
        <!-- Gear drawn for this site: dashed ring = teeth. -->
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" aria-hidden="true">
          <circle cx="12" cy="12" r="8" stroke-width="3" stroke-dasharray="3.28 3"/>
          <circle cx="12" cy="12" r="6.2" stroke-width="1.8"/>
          <circle cx="12" cy="12" r="2.4" stroke-width="1.8"/>
        </svg>
      </button>
    </div>
  </header>
  <main id="game"><p class="notice">Chargement…</p></main>
  <dialog id="settings" aria-labelledby="settings-title">
    <h2 id="settings-title">Paramètres</h2>
    <label class="setting">
      <input type="checkbox" id="opt-colorblind">
      <span>
        <span class="setting-label">Mode daltonien</span>
        <span class="setting-hint">Bleu = identique, orange = partiel, gris = différent (au lieu de vert / orange / rouge), aussi dans le résultat copié.</span>
      </span>
    </label>
    <button type="button" class="dialog-close">Fermer</button>
  </dialog>
  <dialog id="feedback" aria-labelledby="feedback-title">
    <h2 id="feedback-title">Donner un avis</h2>
    <form id="feedback-form">
      <label class="field">
        <span class="setting-label">Message</span>
        <textarea name="message" rows="5" maxlength="2000" required placeholder="Une erreur dans un indice, une idée de mode, un bug…"></textarea>
      </label>
      <label class="field">
        <span class="setting-label">E-mail <span class="setting-hint-inline">(facultatif, pour une réponse)</span></span>
        <input type="email" name="email" autocomplete="email">
      </label>
      <!-- Honeypot: hidden from people, filled by some bots (Formspree drops those). -->
      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
      <p class="feedback-status" role="status"></p>
      <div class="dialog-actions">
        <button type="button" class="dialog-close">Fermer</button>
        <button type="submit" class="dialog-submit">Envoyer</button>
      </div>
    </form>
  </dialog>
  <footer>
    <p class="other-dle">Autres jeux en -dle :
      <a href="https://pokedle.net/" target="_blank" rel="noopener">Pokédle</a> ·
      <a href="https://loldle.net/" target="_blank" rel="noopener">LoLdle</a> ·
      <a href="https://narutodle.net/" target="_blank" rel="noopener">Narutodle</a> ·
      <a href="https://onepiecedle.net/" target="_blank" rel="noopener">Onepiecedle</a>
    </p>
    <p><button type="button" id="feedback-open" class="link-btn" hidden>Donner un avis</button></p>
    <p>Site de fans non officiel, sans lien avec Firaxis Games ni 2K.</p>
  </footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
